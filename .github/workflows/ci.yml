name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: servis_takip_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/servis_takip_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_minimum_32_characters_long
      JWT_REFRESH_SECRET: ci_refresh_secret_minimum_32_characters_long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Migrate test database
        run: npm run migrate:up

      # Migration'ların geri alınabilir olduğunu doğrula — bozuk bir down()
        # ancak prod'da geri dönmek gerektiğinde fark edilir, o da en kötü an
      - name: Migration roundtrip
        run: |
          npm run migrate:down
          npm run migrate:up

      - name: Test
        run: npm test

      - name: Build admin panel
        run: npm run build:admin

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Yüksek/kritik açıklar build'i kırar; düşük seviyeliler rapor kalır
      - run: npm audit --audit-level=high
