name: CI

# Runs on every branch, not just main: a long-lived feature branch used to get
# no signal at all until someone opened a pull request, which is how a broken
# lock file and a server that died on boot both survived for weeks.
on:
  push:

# Only the newest run per branch survives, so a quick series of pushes does not
# queue up builds of commits nobody is waiting on any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: servis_takip_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/servis_takip_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_minimum_32_characters_long
      JWT_REFRESH_SECRET: ci_refresh_secret_minimum_32_characters_long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Migrate test database
        run: npm run migrate:up

      # Verify that migrations are reversible — a broken down() is otherwise
        # only noticed when you need to roll back in prod, which is the worst
        # possible moment
      - name: Migration roundtrip
        run: |
          npm run migrate:down
          npm run migrate:up

      - name: Test
        run: npm test

      - name: Build admin panel
        run: npm run build:admin

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # High/critical vulnerabilities fail the build; lower ones stay as a report
      - run: npm audit --audit-level=high

      # The admin panel is a separate npm project with its own lock file, so the
      # audit above never looked at it. It had gone unchecked long enough to
      # collect four high advisories of its own.
      - name: Install admin dependencies
        run: npm --prefix admin ci
      - name: Audit admin panel
        run: npm --prefix admin audit --audit-level=high
