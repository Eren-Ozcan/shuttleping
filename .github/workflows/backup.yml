name: Daily backup

# T2.2 — prod DB'nin günlük pg_dump'ı, GitHub Actions artifact olarak.
#
# Bu workflow prod'daki DATABASE_URL'i GitHub Actions repo secret'ı olarak
# ister — kod hazır, ama aktif olması için hâlâ elle yapılması gereken var:
#   1. Railway'de Postgres servisinde "TCP Proxy" (public networking) aç,
#      dışarıdan erişilebilir bağlantı dizesini al.
#   2. GitHub repo → Settings → Secrets and variables → Actions →
#      DATABASE_URL adıyla bu bağlantı dizesini ekle.
# Bu iki adım hesap/Railway erişimi gerektirdiği için burada bırakıldı. Secret
# tanımlı değilken job hata vermez, adımları atlayıp başarıyla biter — böylece
# deploy öncesi her gece başarısız çalışma bildirimi gelmez.
#
# Artifact'lar GitHub'ın varsayılan saklama süresine tabi (aşağıda 35 gün
# ile sınırlandı) — uzun vadeli/off-site saklama için (ör. S3) ayrı bir adım
# gerekir, MVP için artifact yeterli.

on:
  schedule:
    - cron: '0 2 * * *' # Her gün 02:00 UTC (05:00 Europe/Istanbul)
  workflow_dispatch: {} # Elle de tetiklenebilir

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: DATABASE_URL secret'ı var mı
        id: secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret'ı tanımlı değil — yedek atlanıyor (bkz. bu dosyanın başındaki kurulum notu)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secret.outputs.present == 'true'

      - uses: actions/setup-node@v5
        if: steps.secret.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.secret.outputs.present == 'true'

      - name: pg_dump al
        if: steps.secret.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run backup

      - name: Yedeği artifact olarak yükle
        if: steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: shuttleping-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 35
